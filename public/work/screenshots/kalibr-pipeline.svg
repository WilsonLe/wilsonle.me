<svg xmlns="http://www.w3.org/2000/svg" width="1704" height="923" viewBox="0 0 1704 923" role="img" aria-labelledby="title desc"><title id="title">Kalibr gameplay analytics</title><desc id="desc">Source-backed overview: gameplay events and owner-bound replay records, together with authentication aggregates, feed bounded FastAPI processing, private aggregate snapshots and authenticated admin reporting.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#78e3f2" stroke-width="1.8"/></marker></defs><rect width="1704" height="923" fill="#080b0c"/><g font-family="Arial, sans-serif"><text x="72" y="86" fill="#78e3f2" font-size="22" letter-spacing="3">KALIBR · ARCHITECTURE OVERVIEW</text><text x="72" y="150" fill="#f4eddd" font-size="52">From gameplay to useful reporting</text><g fill="none" stroke="#78e3f2" stroke-width="3" marker-end="url(#arrow)"><path d="M492 305 H565 V440 H622"/><path d="M492 655 H565 V535 H622"/><path d="M1062 440 H1138 V305 H1192"/><path d="M1062 535 H1138 V655 H1192"/><path d="M1422 395 V545"/></g><rect x="72" y="215" width="420" height="180" rx="8" fill="#10191b" stroke="#3a5960" stroke-width="2"/><text x="98" y="268" fill="#f4eddd" font-size="30" font-weight="600">Gameplay</text><text x="98" y="316" fill="#b0c4c6" font-size="23">Product events</text><text x="98" y="350" fill="#b0c4c6" font-size="23">Owner-bound replay records</text><rect x="72" y="565" width="420" height="180" rx="8" fill="#10191b" stroke="#3a5960" stroke-width="2"/><text x="98" y="618" fill="#f4eddd" font-size="30" font-weight="600">Identity</text><text x="98" y="666" fill="#b0c4c6" font-size="23">Supabase Auth aggregates</text><text x="98" y="700" fill="#b0c4c6" font-size="23">Verified administrator identity</text><rect x="642" y="380" width="420" height="180" rx="8" fill="#10191b" stroke="#3a5960" stroke-width="2"/><text x="668" y="433" fill="#f4eddd" font-size="30" font-weight="600">FastAPI processing</text><text x="668" y="481" fill="#b0c4c6" font-size="23">Bounded queries · validation</text><text x="668" y="515" fill="#b0c4c6" font-size="23">Logical plays · coverage limits</text><rect x="1212" y="215" width="420" height="180" rx="8" fill="#10191b" stroke="#3a5960" stroke-width="2"/><text x="1238" y="268" fill="#f4eddd" font-size="30" font-weight="600">Aggregate snapshots</text><text x="1238" y="316" fill="#b0c4c6" font-size="23">Private PostgreSQL cache</text><text x="1238" y="350" fill="#b0c4c6" font-size="23">Sanitised reporting data</text><rect x="1212" y="565" width="420" height="180" rx="8" fill="#10191b" stroke="#3a5960" stroke-width="2"/><text x="1238" y="618" fill="#f4eddd" font-size="30" font-weight="600">Private admin panels</text><text x="1238" y="666" fill="#b0c4c6" font-size="23">Engagement · product usage</text><text x="1238" y="700" fill="#b0c4c6" font-size="23">Game-specific analysis</text><text x="72" y="845" fill="#b0c4c6" font-size="23">Product analytics, replay archives and signed measurement evidence have distinct contracts.</text></g></svg>